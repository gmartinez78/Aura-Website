<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="600" fill="#f9f9f9"/>
  <rect width="500" height="600" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="40" y="80" width="420" height="420" fill="none" stroke="#d0d0d0" stroke-width="2" rx="8"/>

  <!-- Person Placeholder -->
  <circle cx="250" cy="290" r="80" fill="#f0e8d4" stroke="#d0c0a0" stroke-width="2"/>
  <circle cx="230" cy="270" r="8" fill="#333"/>
  <circle cx="270" cy="270" r="8" fill="#333"/>
  <path d="M 240 300 Q 250 310 260 300" stroke="#333" stroke-width="2" fill="none"/>

  <!-- CRM Label (Top Left) -->
  <g>
    <line x1="150" y1="120" x2="105" y2="75" stroke="#666" stroke-width="2"/>
    <rect x="60" y="50" width="90" height="35" fill="#1f2937" rx="6"/>
    <text x="105" y="73" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">CRM</text>
  </g>

  <!-- IA Agents Label (Top Right) -->
  <g>
    <line x1="350" y1="120" x2="395" y2="75" stroke="#666" stroke-width="2"/>
    <rect x="345" y="50" width="110" height="35" fill="#1f2937" rx="6"/>
    <text x="400" y="73" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Agentes IA</text>
  </g>

  <!-- Email Label (Bottom Left) -->
  <g>
    <line x1="150" y1="460" x2="105" y2="515" stroke="#666" stroke-width="2"/>
    <rect x="60" y="525" width="90" height="35" fill="#1f2937" rx="6"/>
    <text x="105" y="548" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Email</text>
  </g>

  <!-- WhatsApp Label (Right Side) -->
  <g>
    <line x1="330" y1="290" x2="385" y2="290" stroke="#666" stroke-width="2"/>
    <rect x="390" y="265" width="95" height="50" fill="#1f2937" rx="6"/>
    <text x="437" y="290" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">WhatsApp</text>
    <text x="437" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">24/7</text>
  </g>

  <!-- Calificación Label (Bottom Right) -->
  <g>
    <line x1="330" y1="450" x2="380" y2="510" stroke="#666" stroke-width="2"/>
    <rect x="330" y="520" width="100" height="35" fill="#1f2937" rx="6"/>
    <text x="380" y="543" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Calificación</text>
  </g>
</svg>