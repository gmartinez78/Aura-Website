<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="600" fill="#f9f9f9"/>
  <rect width="500" height="600" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="40" y="80" width="420" height="420" fill="none" stroke="#d0d0d0" stroke-width="2" rx="8"/>

  <!-- Person Placeholder -->
  <circle cx="250" cy="290" r="80" fill="#d4e8f0" stroke="#a0c0d0" stroke-width="2"/>
  <circle cx="230" cy="270" r="8" fill="#333"/>
  <circle cx="270" cy="270" r="8" fill="#333"/>
  <path d="M 240 300 Q 250 310 260 300" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Landing Pages Label (Top Left) -->
  <g>
    <line x1="150" y1="120" x2="110" y2="80" stroke="#666" stroke-width="2"/>
    <rect x="50" y="50" width="120" height="35" fill="#1f2937" rx="6"/>
    <text x="110" y="73" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Landing Pages</text>
  </g>

  <!-- Conversion Label (Top Right) -->
  <g>
    <line x1="350" y1="120" x2="390" y2="80" stroke="#666" stroke-width="2"/>
    <rect x="330" y="50" width="120" height="35" fill="#1f2937" rx="6"/>
    <text x="390" y="73" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Conversion</text>
  </g>

  <!-- Embudo Label (Bottom Left) -->
  <g>
    <line x1="150" y1="460" x2="100" y2="510" stroke="#666" stroke-width="2"/>
    <rect x="50" y="520" width="100" height="35" fill="#1f2937" rx="6"/>
    <text x="100" y="543" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Embudo</text>
  </g>

  <!-- Datos Label (Right Side) -->
  <g>
    <line x1="330" y1="290" x2="385" y2="290" stroke="#666" stroke-width="2"/>
    <rect x="390" y="270" width="95" height="40" fill="#1f2937" rx="6"/>
    <text x="437" y="292" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Datos +</text>
    <text x="437" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Compra</text>
  </g>

  <!-- Call to Action Label (Bottom Right) -->
  <g>
    <line x1="330" y1="450" x2="375" y2="500" stroke="#666" stroke-width="2"/>
    <rect x="330" y="510" width="100" height="35" fill="#1f2937" rx="6"/>
    <text x="380" y="533" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Call-to-Action</text>
  </g>
</svg>